# Render Blueprint for spotly-api.
#
# Why Render (and not Vercel): this app runs a persistent HTTP server
# (src/main.ts calls app.listen()) plus three recurring background
# sweeps on in-process timers (src/tasks/scheduler.service.ts). Both of
# those need a long-lived process — the opposite of Vercel's serverless
# model, where a function starts per-request and is frozen right after
# responding. Render web services run your Dockerfile as one always-on
# container, so the HTTP server and the sweeps (which run inside the
# same Nest process) both just work.
#
# One-time setup after connecting this repo as a Blueprint in the
# Render dashboard:
#   1. Render provisions spotly-db (Postgres) automatically — no action
#      needed there.
#   2. Fill in the `sync: false` variables below in the dashboard
#      (Cloudinary, Resend, M-Pesa, Google OAuth credentials) — these
#      are secrets, so they're deliberately not in this file.
#   3. Once the first deploy finishes, note the assigned URL
#      (https://spotly-api.onrender.com, or with a random suffix if
#      that name was taken) and double-check PUBLIC_API_URL and
#      GOOGLE_CALLBACK_URL below actually match it — update in the
#      dashboard if Render picked a different name.
#   4. Point spotly-web's and spotly-admin's NEXT_PUBLIC_API_URL (on
#      Vercel) at that same URL.

services:
  - type: web
    name: spotly-api
    runtime: docker
    plan: starter # NOT free — free web services spin down after 15 min
    # idle, which would stop the sweep timers running inside this same
    # process (usage rollups, billing downgrades, and experience expiry
    # never firing while the service is asleep).
    region: oregon
    healthCheckPath: /health
    # Runs the committed migrations (src/database/migrations, compiled to
    # dist/) against the live database before the new build takes over
    # traffic. Uses the compiled runner because the runtime image is
    # built with `npm install --omit=dev` — ts-node isn't there.
    preDeployCommand: npm run migration:run:deploy
    envVars:
      - key: NODE_ENV
        value: "production" # selects .env.prod locally; on Render there's no
        # file, so the injected variables below are used directly. Also what
        # tells the migration runner to use the committed migrations rather
        # than anyone's local-migrations.
      - key: DATABASE_URL
        fromDatabase:
          name: spotly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Spotly <onboarding@resend.dev>" # switch to a verified domain before real launch
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://spotly-api.onrender.com/auth/google/callback" # verify/update per step 3 above
      - key: PUBLIC_API_URL
        value: "https://spotly-api.onrender.com" # verify/update per step 3 above
      - key: FRONTEND_URL
        sync: false # your spotly-web Vercel URL, e.g. https://spotly.co.ke or https://spotly-web.vercel.app
      - key: MPESA_ENV
        value: "sandbox" # switch to "production" when you have real Daraja production credentials
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: "https://spotly-api.onrender.com/payment/mpesa/callback" # verify/update per step 3 above; confirm path matches payment.controller.ts

databases:
  - name: spotly-db
    plan: basic-256mb
    region: oregon
